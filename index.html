<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Turbo Racer 3D - Real 3D</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#000;color:#fff;overflow:hidden;text-align:center}
#top{display:flex;justify-content:space-between;padding:10px 15px;background:#111;position:relative;z-index:10}#top b{color:#ffcc00}
#game{width:100%;height:calc(100vh - 190px);position:relative}
canvas{display:block}
#controls{position:fixed;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:15px;z-index:10}
#controls button{width:75px;height:75px;border-radius:50%;border:2px solid #fff;font-size:32px;background:rgba(0,0,0,.6);color:#fff}
#nitro{background:#ff3b30!important;box-shadow:0 0 20px #ff3b30}
#startBtn{background:#25D366;border:0;padding:13px 35px;border-radius:30px;color:#fff;font-size:18px;font-weight:bold;margin:8px}
#over{position:fixed;top:35%;left:20px;right:20px;background:rgba(0,0,0,.9);padding:20px;display:none;z-index:20;border-radius:15px;border:2px solid #ffcc00}
#msg{position:fixed;top:70px;left:0;right:0;font-size:22px;font-weight:bold;color:#ffcc00;z-index:10;text-shadow:0 0 10px #000}
</style></head><body>
<div id="top"><span>🪙 <b id="coins">0</b></span><span>SCORE: <b id="score">0</b></span><span>❤️ <b id="lives">3</b></span></div>
<h2 style="padding:5px">🏎️ TURBO RACER <span style="color:#ffcc00">REAL 3D</span></h2>
<div id="msg"></div>
<div id="game"></div>
<div id="controls">
<button onpointerdown="ml=true" onpointerup="ml=false" onpointerleave="ml=false">◀️</button>
<button id="nitro" onpointerdown="nitro=true" onpointerup="nitro=false">🔥</button>
<button onpointerdown="mr=true" onpointerup="mr=false" onpointerleave="mr=false">▶️</button>
</div>
<button id="startBtn" onclick="startGame()">▶️ GAME START</button>
<div id="over"><h2>💥 GAME OVER!</h2><p style="margin:12px">Score: <b id="finalScore">0</b> | Coins: <b id="finalCoins">0</b></p><button id="startBtn" onclick="startGame()">🔄 DOBARA KHELO</button></div>

<script>
let scene,camera,renderer,playerCar,enemies=[],coinsArr=[],roadLines=[],buildings=[];
let score=0,coins=0,lives=3,speed=0,playing=false,ml=false,mr=false,nitro=false,px=0;
let lastSpawn=0,lastCoin=0;

function makeCar(color){
  let g=new THREE.Group();
  let body=new THREE.Mesh(new THREE.BoxGeometry(1.8,0.6,3.8),new THREE.MeshLambertMaterial({color:color}));
  body.position.y=0.6; g.add(body);
  let cabin=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.6,1.8),new THREE.MeshLambertMaterial({color:0x111111}));
  cabin.position.y=1.1; cabin.position.z=-0.2; g.add(cabin);
  let wGeo=new THREE.CylinderGeometry(0.35,0.35,0.3,12); let wMat=new THREE.MeshLambertMaterial({color:0x000000});
  [[-0.9,0.3,1.2],[0.9,0.3,1.2],[-0.9,0.3,-1.2],[0.9,0.3,-1.2]].forEach(p=>{
    let w=new THREE.Mesh(wGeo,wMat); w.rotation.z=Math.PI/2; w.position.set(p[0],p[1],p[2]); g.add(w);
  });
  let light=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.2,0.1),new THREE.MeshLambertMaterial({color:0xffff00}));
  light.position.set(0,0.7,1.95); g.add(light);
  return g;
}
function init(){
  scene=new THREE.Scene(); scene.background=new THREE.Color(0x87ceeb); scene.fog=new THREE.Fog(0x87ceeb,50,140);
  camera=new THREE.PerspectiveCamera(75,window.innerWidth/(window.innerHeight-190),0.1,300);
  renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(window.innerWidth,window.innerHeight-190);
  document.getElementById('game').appendChild(renderer.domElement);
  let light=new THREE.AmbientLight(0xffffff,0.9); scene.add(light);
  let sun=new THREE.DirectionalLight(0xffffff,0.8); sun.position.set(10,20,10); scene.add(sun);
  // Ground
  let ground=new THREE.Mesh(new THREE.PlaneGeometry(200,300),new THREE.MeshLambertMaterial({color:0x2ecc71}));
  ground.rotation.x=-Math.PI/2; ground.position.y=-0.1; scene.add(ground);
  // Road
  let road=new THREE.Mesh(new THREE.PlaneGeometry(12,300),new THREE.MeshLambertMaterial({color:0x333333}));
  road.rotation.x=-Math.PI/2; scene.add(road);
  for(let i=0;i<20;i++){
    let line=new THREE.Mesh(new THREE.PlaneGeometry(0.3,4),new THREE.MeshBasicMaterial({color:0xffffff}));
    line.rotation.x=-Math.PI/2; line.position.set(-2,0.02,-i*15); scene.add(line); roadLines.push(line);
    let line2=line.clone(); line2.position.x=2; scene.add(line2); roadLines.push(line2);
  }
  // Buildings
  for(let i=0;i<30;i++){
    let h=Math.random()*10+5;
    let b=new THREE.Mesh(new THREE.BoxGeometry(6,h,6),new THREE.MeshLambertMaterial({color:Math.random()*0xffffff}));
    b.position.set(i%2==0?-14:14, h/2, -i*12); scene.add(b); buildings.push(b);
  }
  playerCar=makeCar(0xff0000); scene.add(playerCar);
  camera.position.set(0,5,8); camera.lookAt(0,1,-10);
  animate();
}
function showMsg(t){let m=document.getElementById('msg');m.textContent=t;setTimeout(()=>m.textContent='',1300);}
function startGame(){
  playing=true; score=0; coins=0; lives=3; speed=0.6; px=0;
  enemies.forEach(e=>scene.remove(e)); enemies=[];
  coinsArr.forEach(c=>scene.remove(c)); coinsArr=[];
  document.getElementById('over').style.display='none';
  showMsg('🚦 READY... GO!');
}
function spawnEnemy(){
  let colors=[0x0000ff,0xffff00,0xffffff,0x00ff00,0xff00ff];
  let car=makeCar(colors[Math.floor(Math.random()*colors.length)]);
  let lanes=[-4,0,4]; let x=lanes[Math.floor(Math.random()*3)];
  car.position.set(x,0,-120); car.rotation.y=Math.PI; scene.add(car);
  enemies.push(car);
}
function spawnCoin(){
  let c=new THREE.Mesh(new THREE.CylinderGeometry(0.6,0.6,0.2,20),new THREE.MeshLambertMaterial({color:0xffcc00}));
  c.rotation.x=Math.PI/2; let lanes=[-4,0,4]; c.position.set(lanes[Math.floor(Math.random()*3)],0.8,-120); scene.add(c); coinsArr.push(c);
}
function animate(){
  requestAnimationFrame(animate);
  if(playing){
    let curSpeed=nitro?speed+0.6:speed;
    if(speed<1.2 && !nitro) speed+=0.002;
    score+=nitro?2:1;
    if(score%1000==0){showMsg('🔥 LEVEL UP! TEZ HO GAYI!'); speed+=0.15;}
    document.getElementById('score').textContent=score;
    document.getElementById('coins').textContent=coins;
    document.getElementById('lives').textContent=lives;
    if(ml && px>-4) px-=0.15; if(mr && px<4) px+=0.15;
    playerCar.position.x=px;
    playerCar.position.z=0;
    // Road move
    roadLines.forEach(l=>{l.position.z+=curSpeed*3; if(l.position.z>10) l.position.z-=300;});
    buildings.forEach(b=>{b.position.z+=curSpeed*3; if(b.position.z>20) b.position.z-=360;});
    if(Date.now()-lastSpawn>900){spawnEnemy(); lastSpawn=Date.now();}
    if(Date.now()-lastCoin>1800){spawnCoin(); lastCoin=Date.now();}
    enemies.forEach((e,idx)=>{
      e.position.z+=curSpeed*3;
      if(e.position.z>15){scene.remove(e); enemies.splice(idx,1);}
      if(Math.abs(e.position.z)<3 && Math.abs(e.position.x-px)<1.6){
        scene.remove(e); enemies.splice(idx,1); lives--; navigator.vibrate&&navigator.vibrate(300);
        if(lives<=0){playing=false; document.getElementById('finalScore').textContent=score; document.getElementById('finalCoins').textContent=coins; document.getElementById('over').style.display='block';}
        else showMsg('💥 TAKKAR! '+lives+' LIVES BAKI');
      }
    });
    coinsArr.forEach((c,idx)=>{
      c.position.z+=curSpeed*3; c.rotation.z+=0.1;
      if(c.position.z>15){scene.remove(c); coinsArr.splice(idx,1);}
      if(Math.abs(c.position.z)<2 && Math.abs(c.position.x-px)<1.2){scene.remove(c); coinsArr.splice(idx,1); coins+=5; score+=50; showMsg('🪙 +5 COINS!');}
    });
    camera.position.x=px*0.5;
  }
  camera.lookAt(px*0.5,1,-10);
  renderer.render(scene,camera);
}
init();
</script></body></html>
