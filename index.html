<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Turbo Racer 3D - AK</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#000;color:#fff;overflow:hidden;text-align:center}
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:10px 15px;background:rgba(0,0,0,.6);z-index:10;font-weight:bold}#hud b{color:#ffcc00}
#title{position:absolute;top:40px;left:0;right:0;z-index:10;font-size:20px;text-shadow:0 0 10px #000}
#controls{position:absolute;bottom:15px;left:0;right:0;display:flex;justify-content:center;gap:15px;z-index:10}
#controls button{width:75px;height:75px;border-radius:50%;border:2px solid #fff;font-size:30px;background:rgba(255,255,255,.2);color:#fff}
#nitro{background:#ff3b30!important;box-shadow:0 0 20px red}
#start{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);z-index:20;background:#25D366;border:0;padding:16px 35px;border-radius:30px;color:#fff;font-size:20px;font-weight:bold}
#over{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);z-index:20;background:rgba(0,0,0,.9);padding:25px;border-radius:20px;border:2px solid #ffcc00;display:none}
#msg{position:absolute;top:80px;left:0;right:0;z-index:10;font-size:24px;font-weight:bold;color:#ffcc00;text-shadow:0 0 10px #000}
</style></head><body>
<div id="hud"><span>🪙 <b id="coins">0</b></span><span>SCORE: <b id="score">0</b></span><span>❤️ <b id="lives">3</b></span><span>🔥 <b id="speed">0</b></span></div>
<div id="title">🏎️ TURBO RACER 3D - LAHORE</div>
<div id="msg"></div>
<button id="start" onclick="startGame()">▶️ GAME START</button>
<div id="over"><h2>💥 GAME OVER</h2><p style="margin:12px">Score: <b id="final">0</b></p><button onclick="startGame()" style="background:#25D366;border:0;padding:12px 25px;border-radius:20px;color:#fff;font-weight:bold">🔄 DOBARA KHELO</button></div>
<div id="controls"><button onpointerdown="left=true" onpointerup="left=false" onpointerleave="left=false">◀️</button><button id="nitro" onpointerdown="nitro=true" onpointerup="nitro=false">🔥</button><button onpointerdown="right=true" onpointerup="right=false" onpointerleave="right=false">▶️</button></div>
<script>
let scene,camera,renderer,player,roadLines=[],enemies=[],coinsArr=[],buildings=[],trees=[];
let score=0,coins=0,lives=3,speed=0,playing=false,left=false,right=false,nitro=false,px=0,frame=0;
function init(){
 scene=new THREE.Scene(); scene.background=new THREE.Color(0x87ceeb); scene.fog=new THREE.Fog(0x87ceeb, 30, 120);
 camera=new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 300);
 renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth, innerHeight); document.body.appendChild(renderer.domElement);
 // Lights
 scene.add(new THREE.AmbientLight(0xffffff, 0.8)); let sun=new THREE.DirectionalLight(0xffffff,0.8); sun.position.set(10,20,10); scene.add(sun);
 // Ground
 let ground=new THREE.Mesh(new THREE.PlaneGeometry(200,400), new THREE.MeshLambertMaterial({color:0x2e8b57})); ground.rotation.x=-Math.PI/2; ground.position.z=-100; scene.add(ground);
 // Road
 let road=new THREE.Mesh(new THREE.PlaneGeometry(12,400), new THREE.MeshLambertMaterial({color:0x333333})); road.rotation.x=-Math.PI/2; road.position.z=-100; scene.add(road);
 // Road lines
 for(let i=0;i<20;i++){ let l=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.1,4), new THREE.MeshBasicMaterial({color:0xffffff})); l.position.set(0,0.1,-i*20); scene.add(l); roadLines.push(l); }
 // Player Car - 3D
 player=new THREE.Group();
 let body=new THREE.Mesh(new THREE.BoxGeometry(2,0.8,4), new THREE.MeshLambertMaterial({color:0xff0000})); body.position.y=0.7; player.add(body);
 let cabin=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.7,2), new THREE.MeshLambertMaterial({color:0x111111})); cabin.position.y=1.4; cabin.position.z=0.2; player.add(cabin);
 let spoiler=new THREE.Mesh(new THREE.BoxGeometry(2.2,0.2,0.5), new THREE.MeshLambertMaterial({color:0x000000})); spoiler.position.set(0,1,-2); player.add(spoiler);
 // Wheels
 [[-1.1,1.5],[1.1,1.5],[-1.1,-1.5],[1.1,-1.5]].forEach(p=>{ let w=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,0.4,12), new THREE.MeshLambertMaterial({color:0x000000})); w.rotation.z=Math.PI/2; w.position.set(p[0],0.5,p[1]); player.add(w); });
 player.position.set(0,0,0); scene.add(player);
 camera.position.set(0,5,8); camera.lookAt(0,1,-10);
 animate();
}
function makeEnemy(){
 let g=new THREE.Group(); let colors=[0x0000ff,0xffff00,0xffffff,0x00ff00];
 let b=new THREE.Mesh(new THREE.BoxGeometry(2,0.8,4), new THREE.MeshLambertMaterial({color:colors[Math.floor(Math.random()*colors.length)]})); b.position.y=0.7; g.add(b);
 let c=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.7,2), new THREE.MeshLambertMaterial({color:0x111111})); c.position.y=1.4; g.add(c);
 let lanes=[-4,0,4]; g.position.set(lanes[Math.floor(Math.random()*3)],0,-120); scene.add(g); enemies.push(g);
}
function makeCoin(){
 let c=new THREE.Mesh(new THREE.CylinderGeometry(0.8,0.8,0.2,20), new THREE.MeshLambertMaterial({color:0xffd700})); c.rotation.x=Math.PI/2;
 let lanes=[-4,0,4]; c.position.set(lanes[Math.floor(Math.random()*3)],1,-120); scene.add(c); coinsArr.push(c);
}
function makeBuilding(){
 let h=8+Math.random()*15; let b=new THREE.Mesh(new THREE.BoxGeometry(6,h,6), new THREE.MeshLambertMaterial({color:Math.random()*0xffffff})); let side=Math.random()>0.5?12:-12; b.position.set(side,h/2,-120); scene.add(b); buildings.push(b);
}
function showMsg(t){ document.getElementById('msg').textContent=t; setTimeout(()=>document.getElementById('msg').textContent='',1200); }
function startGame(){
 if(!scene) init();
 playing=true; score=0; coins=0; lives=3; px=0; speed=0;
 enemies.forEach(e=>scene.remove(e)); coinsArr.forEach(c=>scene.remove(c)); buildings.forEach(b=>scene.remove(b)); enemies=[];coinsArr=[];buildings=[];
 document.getElementById('start').style.display='none'; document.getElementById('over').style.display='none'; showMsg('🚦 GO GO GO!');
}
function animate(){
 requestAnimationFrame(animate);
 if(playing){
  frame++; let curSpeed=nitro?1.2:0.7; speed=Math.round(curSpeed*180);
  if(left&&px>-4) px-=0.15; if(right&&px<4) px+=0.15; player.position.x+=(px-player.position.x)*0.2; player.rotation.z=left?0.1:right?-0.1:0;
  score+=nitro?2:1;
  roadLines.forEach(l=>{ l.position.z+=curSpeed*2; if(l.position.z>10) l.position.z=-190; });
  if(frame%80==0) makeEnemy(); if(frame%120==0) makeCoin(); if(frame%60==0) makeBuilding();
  enemies.forEach((e,i)=>{ e.position.z+=curSpeed*1.8; if(e.position.z>10){scene.remove(e);enemies.splice(i,1);}
   if(Math.abs(e.position.z-player.position.z)<3 && Math.abs(e.position.x-player.position.x)<1.8){ scene.remove(e); enemies.splice(i,1); lives--; navigator.vibrate&&navigator.vibrate(300); if(lives<=0){ playing=false; document.getElementById('final').textContent=score; document.getElementById('over').style.display='block'; } else showMsg('💥 TAKKAR! '+lives+' LIVES'); } });
  coinsArr.forEach((c,i)=>{ c.position.z+=curSpeed*1.8; c.rotation.z+=0.1; if(c.position.z>10){scene.remove(c);coinsArr.splice(i,1);}
   if(Math.abs(c.position.z-player.position.z)<2 && Math.abs(c.position.x-player.position.x)<1.5){ scene.remove(c); coinsArr.splice(i,1); coins+=5; score+=100; showMsg('🪙 +5 COINS!'); } });
  buildings.forEach((b,i)=>{ b.position.z+=curSpeed*1.8; if(b.position.z>10){scene.remove(b);buildings.splice(i,1);} });
  document.getElementById('score').textContent=score; document.getElementById('coins').textContent=coins; document.getElementById('lives').textContent=lives; document.getElementById('speed').textContent=speed;
 }
 renderer.render(scene,camera);
}
init();
</script></body></html>
