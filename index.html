<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AK Beach Buggy Race</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#000;color:#fff;overflow:hidden;text-align:center}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:10px;background:rgba(0,0,0,.6);z-index:10;font-weight:bold}
#hud b{color:#ffe600}
#msg{position:fixed;top:60px;left:0;right:0;z-index:10;font-size:22px;font-weight:bold;color:#ffe600;text-shadow:0 0 10px #000}
#controls{position:fixed;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:12px;z-index:10}
#controls button{width:75px;height:75px;border-radius:50%;border:2px solid #fff;font-size:30px;background:rgba(0,0,0,.5);color:#fff}
#powerBtn{background:#a55eea!important}
#start{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);z-index:20;background:#ff6b00;border:0;padding:16px 35px;border-radius:30px;color:#fff;font-size:20px;font-weight:bold}
#over{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);z-index:20;background:rgba(0,0,0,.92);padding:25px;border-radius:20px;border:3px solid #ff6b00;display:none}
</style></head><body>
<div id="hud"><span>POS: <b id="pos">4/4</b></span><span>LAP: <b id="lap">1/3</b></span><span>🪙 <b id="coins">0</b></span><span>POWER: <b id="power">None</b></span></div>
<div id="msg">🏖️ AK BEACH BUGGY RACE</div>
<button id="start" onclick="startGame()">▶️ RACE START</button>
<div id="over"><h2 id="result">🏆 YOU WIN!</h2><p style="margin:12px">Coins: <b id="finalCoins">0</b></p><button onclick="startGame()" style="background:#ff6b00;border:0;padding:12px 25px;border-radius:20px;color:#fff;font-weight:bold">🔄 DOBARA RACE</button></div>
<div id="controls"><button onpointerdown="left=true" onpointerup="left=false">◀️</button><button id="powerBtn" onclick="usePower()">⚡</button><button onpointerdown="right=true" onpointerup="right=false">▶️</button></div>
<script>
let scene,camera,renderer,player,opponents=[],powerBoxes=[],coinsArr=[],palms=[],speed=0,playing=false,left=false,right=false,px=0,lap=1,totalDist=0,oppDist=[0,0,0],coins=0,curPower='None',frame=0;
function makeBuggy(color){
 let g=new THREE.Group();
 let body=new THREE.Mesh(new THREE.BoxGeometry(2,0.7,3.6),new THREE.MeshLambertMaterial({color:color})); body.position.y=0.7; g.add(body);
 let seat=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.8,1),new THREE.MeshLambertMaterial({color:0x222222})); seat.position.y=1.3; seat.position.z=0.3; g.add(seat);
 // Roll cage
 let cage=new THREE.Mesh(new THREE.BoxGeometry(1.7,0.8,0.15),new THREE.MeshLambertMaterial({color:0x000000})); cage.position.set(0,1.8,-0.4); g.add(cage);
 // Big Buggy Wheels - Beach Buggy style
 let wg=new THREE.CylinderGeometry(0.55,0.55,0.5,14); let wm=new THREE.MeshLambertMaterial({color:0x111111});
 [[-1.2,1.3],[1.2,1.3],[-1.2,-1.3],[1.2,-1.3]].forEach(p=>{let w=new THREE.Mesh(wg,wm); w.rotation.z=Math.PI/2; w.position.set(p[0],0.55,p[1]); g.add(w);});
 return g;
}
function init(){
 scene=new THREE.Scene(); scene.background=new THREE.Color(0x87ceeb); scene.fog=new THREE.Fog(0x87ceeb,40,150);
 camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,300); renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight); document.body.appendChild(renderer.domElement);
 scene.add(new THREE.AmbientLight(0xffffff,0.9)); let sun=new THREE.DirectionalLight(0xffffff,0.7); sun.position.set(10,20,10); scene.add(sun);
 // Beach Sand
 let sand=new THREE.Mesh(new THREE.PlaneGeometry(300,400),new THREE.MeshLambertMaterial({color:0xfdcb6e})); sand.rotation.x=-Math.PI/2; sand.position.z=-100; scene.add(sand);
 // Sea - left side
 let sea=new THREE.Mesh(new THREE.PlaneGeometry(60,400),new THREE.MeshLambertMaterial({color:0x00bfff})); sea.rotation.x=-Math.PI/2; sea.position.set(-35,0.1,-100); scene.add(sea);
 // Road - sand track
 let road=new THREE.Mesh(new THREE.PlaneGeometry(13,400),new THREE.MeshLambertMaterial({color:0xe17055})); road.rotation.x=-Math.PI/2; road.position.z=-100; scene.add(road);
 player=makeBuggy(0xff0000); scene.add(player);
 // Opponents - Beach Buggy style
 let cols=[0x0000ff,0x00ff00,0xffff00]; cols.forEach((c,i)=>{let o=makeBuggy(c); o.position.set((i-1)*3.5,0,-15-i*4); scene.add(o); opponents.push(o);});
 animate();
}
function showMsg(t){document.getElementById('msg').textContent=t; setTimeout(()=>{if(playing)document.getElementById('msg').textContent='';},1200);}
function startGame(){playing=true; lap=1; totalDist=0; oppDist=[0,0,0]; coins=0; curPower='None'; px=0; speed=0; document.getElementById('start').style.display='none'; document.getElementById('over').style.display='none'; showMsg('🚦 3...2...1... GO!');}
function usePower(){
 if(curPower=='None'){showMsg('Pehle 🎁 uthao!');return;}
 if(curPower=='Rocket'){opponents.forEach(o=>{o.position.z-=25;}); showMsg('🚀 ROCKET! SAB PEECHE!');}
 if(curPower=='Boost'){speed=1.6; setTimeout(()=>speed=0.8,3000); showMsg('🔥 SUPER BOOST!');}
 if(curPower=='Shield'){showMsg('🛡️ SHIELD!');}
 curPower='None'; document.getElementById('power').textContent='None';
}
function spawnPower(){let b=new THREE.Mesh(new THREE.BoxGeometry(1.2,1.2,1.2),new THREE.MeshLambertMaterial({color:0xa55eea})); b.position.set([-4,0,4][Math.floor(Math.random()*3)],1,-120); scene.add(b); powerBoxes.push(b);}
function spawnCoin(){let c=new THREE.Mesh(new THREE.CylinderGeometry(0.7,0.7,0.2,18),new THREE.MeshLambertMaterial({color:0xffd700})); c.rotation.x=Math.PI/2; c.position.set([-4,0,4][Math.floor(Math.random()*3)],1,-120); scene.add(c); coinsArr.push(c);}
function animate(){
 requestAnimationFrame(animate);
 if(playing){
  frame++; if(left&&px>-4)px-=0.12; if(right&&px<4)px+=0.12; player.position.x+=(px-player.position.x)*0.2; player.position.z=0;
  if(speed<0.8) speed+=0.002; totalDist+=speed;
  if(totalDist>400){lap++; totalDist=0; if(lap>3){playing=false; let myPos=oppDist.filter(d=>d>totalDist).length+1; document.getElementById('result').textContent=myPos==1?'🏆 YOU WIN! 1st!':'🏁 '+myPos+'th - Dobara Try Karo!'; document.getElementById('finalCoins').textContent=coins; document.getElementById('over').style.display='block';}}
  opponents.forEach((o,i)=>{ o.position.z+= (0.55+Math.random()*0.01) - speed; oppDist[i]+=0.55; if(o.position.z>20)o.position.z=-120; if(o.position.z<-120)o.position.z=20; o.position.x=Math.sin(frame*0.01+i)*3; });
  if(frame%150==0) spawnPower(); if(frame%90==0) spawnCoin();
  powerBoxes.forEach((b,i)=>{ b.position.z+=speed*2; b.rotation.y+=0.05; if(b.position.z>10){scene.remove(b); powerBoxes.splice(i,1);} if(Math.abs(b.position.z)<2 && Math.abs(b.position.x-player.position.x)<1.5){scene.remove(b); powerBoxes.splice(i,1); curPower=['Rocket','Boost','Shield'][Math.floor(Math.random()*3)]; document.getElementById('power').textContent=curPower; showMsg('🎁 MILA: '+curPower+'! ⚡ dabao!');}});
  coinsArr.forEach((c,i)=>{ c.position.z+=speed*2; c.rotation.z+=0.1; if(c.position.z>10){scene.remove(c); coinsArr.splice(i,1);} if(Math.abs(c.position.z)<2 && Math.abs(c.position.x-player.position.x)<1.5){scene.remove(c); coinsArr.splice(i,1); coins+=5; showMsg('🪙 +5!');}});
  // HUD
  let ahead=oppDist.filter(d=>d>totalDist+(lap-1)*400).length; document.getElementById('pos').textContent=(ahead+1)+'/4'; document.getElementById('lap').textContent=lap+'/3'; document.getElementById('coins').textContent=coins;
  camera.position.set(player.position.x*0.6,5,9); camera.lookAt(player.position.x*0.6,1,-10);
 }
 renderer.render(scene,camera);
}
init();
</script></body></html>
